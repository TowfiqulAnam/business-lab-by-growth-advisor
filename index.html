 'THE ENTERPRISE LAB':'এন্টারপ্রাইজ ল্যাব','Your ambition has room to grow.':'আপনার স্বপ্ন আরও বড় হতে পারে।','A look at what’s next for Business Lab by Growth Advisor.':'Business Lab-এর আগামী দিনের পরিকল্পনা দেখুন।','Today, build your instincts.':'আজ নিজের দক্ষতা গড়ুন।','Tomorrow, build your advantage.':'আগামীকাল ব্যবসার সুবিধা তৈরি করুন।','Explore the next generation of business simulations. Select a feature to see the vision.':'পরবর্তী প্রজন্মের সিমুলেশন জানুন। পরিকল্পনা দেখতে ফিচার বেছে নিন।','Growth services, with your permission.':'আপনার সম্মতিতে গ্রোথ সার্ভিস।','FUTURE ROADMAP':'ভবিষ্যৎ রোডম্যাপ','Read data & privacy details':'তথ্য ও গোপনীয়তার বিস্তারিত','V3.0 includes a local consultation lead form. Briefs are saved on this device and shared only through your chosen WhatsApp or email action. Google Drive uploads are manual.':'V3.0-তে লোকাল পরামর্শ ফর্ম রয়েছে। ব্রিফ এই ডিভাইসে থাকে এবং আপনার নির্বাচিত হোয়াটসঅ্যাপ বা ইমেইলে শেয়ার হয়। Google Drive-এ নিজে আপলোড করতে হবে।',
 'Your founder field guide':'উদ্যোক্তার ব্যবহার নির্দেশিকা','1. Plan.':'১. পরিকল্পনা করুন।','2. Operate.':'২. ব্যবসা চালান।','3. Review.':'৩. হিসাব দেখুন।','4. Repeat.':'৪. আবার করুন।','Model assumptions.':'মডেলের অনুমান।','Saving.':'সেভ করা।','Buy stock, choose a price, and set your marketing budget. Fixed overhead and upfront costs must fit your cash balance.':'স্টক কিনুন, দাম ও মার্কেটিং বাজেট ঠিক করুন। স্থায়ী ও আগাম খরচ হাতে থাকা ক্যাশের মধ্যে রাখতে হবে।','Watch the 18-second day. Resolve two inbox events within five seconds each. The second choice is the default. Pause whenever you need.':'১৮ সেকেন্ডের দিন দেখুন। দুটি ইনবক্স ঘটনার প্রতিটিতে পাঁচ সেকেন্ডে সিদ্ধান্ত নিন। দ্বিতীয় অপশনটি ডিফল্ট। চাইলে বিরতি দিন।','Cash and profit are different. Restocking uses cash; only delivered goods become COGS. Returned goods come back to stock, but packaging and courier fees are lost.':'ক্যাশ ও লাভ আলাদা। স্টক কিনতে ক্যাশ লাগে; শুধু ডেলিভারি হওয়া পণ্য COGS হয়। রিটার্ন স্টকে ফেরে, কিন্তু প্যাকেজিং ও কুরিয়ারের খরচ ফেরে না।','Protect margin, cash, reputation, and your energy. Higher prices reduce demand; high stress hurts conversion. Finish 7 or 30 days to earn your grade.':'মার্জিন, ক্যাশ, সুনাম ও নিজের শক্তি রক্ষা করুন। দাম বাড়লে চাহিদা কমে; চাপ বেশি হলে কনভার্সন কমে। গ্রেড পেতে ৭ বা ৩০ দিন শেষ করুন।',
 'Planning illustration for discussion. No investment return is guaranteed.':'আলোচনার জন্য পরিকল্পনার উদাহরণ। বিনিয়োগের রিটার্ন নিশ্চিত নয়।','Target market:':'টার্গেট মার্কেট:','Owner:':'মালিক:','Starting capital:':'শুরুর পুঁজি:','Contribution = price − buying cost − packaging − business-paid courier. Break-even excludes returns and one-off events. Inventory purchases use cash; only delivered stock is COGS.':'কন্ট্রিবিউশন = দাম − ক্রয়মূল্য − প্যাকেজিং − ব্যবসার দেওয়া কুরিয়ার চার্জ। ব্রেক-ইভেনে রিটার্ন ও এককালীন খরচ ধরা নেই। স্টক কিনতে ক্যাশ লাগে; শুধু ডেলিভারি হওয়া পণ্য COGS হয়।','The live simulation retains its original 5–15% baseline RTO and operational event effects. Preset rates are proposal assumptions only.':'লাইভ সিমুলেশনের মূল ৫–১৫% RTO এবং ইভেন্টের প্রভাব অপরিবর্তিত। প্রিসেটের হার শুধু প্রস্তাবনার অনুমান।','WhatsApp · Request your free business audit':'হোয়াটসঅ্যাপ · ফ্রি বিজনেস অডিটের অনুরোধ করুন','Email':'ইমেইল','Certified by Business Lab for educational simulation use only. This proposal is not an audited valuation or funding commitment.':'শুধু শিক্ষামূলক সিমুলেশনের জন্য Business Lab-এর সনদ। এটি নিরীক্ষিত মূল্যায়ন বা অর্থায়নের প্রতিশ্রুতি নয়।','Grade = 60 + 2 × ROI percentage + 0.45 × (reputation − 65), with penalties for peak stress above 65 and bankruptcy. A+ ≥ 90, A ≥ 80, B ≥ 70, C ≥ 55, D ≥ 40, otherwise F. This is a learning score, not a business valuation.':'গ্রেড = ৬০ + ২ × ROI শতাংশ + ০.৪৫ × (সুনাম − ৬৫)। সর্বোচ্চ চাপ ৬৫-এর বেশি বা দেউলিয়া হলে পয়েন্ট কমে। A+ ≥ ৯০, A ≥ ৮০, B ≥ ৭০, C ≥ ৫৫, D ≥ ৪০; অন্যথায় F। এটি শেখার স্কোর, ব্যবসার মূল্যায়ন নয়।'
});
I18N_PATTERNS.push(
 [/^(.+) at purchase cost$/,'$1 ক্রয়মূল্যে'],[/^(.+) units at purchase cost$/,'$1 ইউনিট, ক্রয়মূল্যে'],[/^~(.+) orders$/,'প্রায় $1 অর্ডার'],
 [/^Your marketing cost was (.+) per delivered order\. Increase budgets gradually while protecting contribution margin\.$/,'প্রতি ডেলিভারি অর্ডারে মার্কেটিং খরচ $1। মার্জিন ঠিক রেখে ধীরে বাজেট বাড়ান।'],
 [/^(.+) is still tied up in stock\. Use a rolling forecast and keep an overhead buffer before committing to your next batch\.$/,'$1 এখনো স্টকে আটকে আছে। পরের ব্যাচের আগে ফোরকাস্ট করুন এবং স্থায়ী খরচের রিজার্ভ রাখুন।'],
 [/^You completed (\d+) days with (\d+)% reputation\. Keep a daily review habit: forecast, operate, compare, and change one decision at a time\.$/,'আপনি $2% সুনাম নিয়ে $1 দিন শেষ করেছেন। প্রতিদিন ফোরকাস্ট, অপারেশন ও ফল তুলনা করুন; একবারে একটি সিদ্ধান্ত বদলান।'],
 [/^Customers pay delivery on successful orders\. Contribution margin: (.+)%\.$/,'সফল ডেলিভারির চার্জ ক্রেতা দেয়। কন্ট্রিবিউশন মার্জিন: $1%।'],
 [/^Business pays delivery on successful orders\. Contribution margin: (.+)%\.$/,'সফল ডেলিভারির চার্জ ব্যবসা দেয়। কন্ট্রিবিউশন মার্জিন: $1%।'],
 [/^Proposal RTO assumption: (.+)%\. Review actual RTO after each day\.$/,'প্রস্তাবনায় RTO অনুমান: $1%। প্রতিদিনের প্রকৃত RTO যাচাই করুন।'],
 [/^(.+) · (\d+) of (\d+) days completed( · Provisional score)?$/,'$1 · $3 দিনের মধ্যে $2 দিন সম্পন্ন'],
 [/^Net (profit|loss): (.+)$/,'নিট লাভ / ক্ষতি: $2'],[/^(\d+) paid deliveries · (.+) product revenue after discounts$/,'$1টি পেইড ডেলিভারি · ডিসকাউন্টের পর পণ্য আয় $2']
);
I18N_EN=Object.fromEntries(Object.entries(I18N).map(([en,bn])=>[bn,en]));
// Add language switching inside dialogs without rerendering forms or operations.
const modalBeforeMisToolbar=showModal;
showModal=function(html,small=false){modalBeforeMisToolbar(html,small);const heading=$('modalRoot').querySelector('.modal-head');if(heading)heading.insertAdjacentHTML('afterend',`<div class="mis-dialog-toolbar"><button class="btn" data-mis="language" data-no-i18n>🇧🇩 বাংলা | 🇬🇧 EN</button><button class="btn" data-mis="consult">Consult Growth Advisor</button></div>`);};

// Lightweight project management is independent of simulation and nightly habit state.
const PROJECT_KEY='growth_advisor_projects_v1';
let projectBoard={name:'My Business Launch',tasks:[{id:'launch-1',title:'Validate the offer with five potential buyers',owner:'',due:'',priority:'High',status:'To do'},{id:'launch-2',title:'Confirm supplier cost and delivery terms',owner:'',due:'',priority:'Normal',status:'To do'},{id:'launch-3',title:'Launch a small campaign and review delivered-order profit',owner:'',due:'',priority:'Normal',status:'To do'}]},projectEditing=null;
try{const saved=JSON.parse(localStorage.getItem(PROJECT_KEY)||'null');if(saved&&typeof saved.name==='string'&&Array.isArray(saved.tasks)&&saved.tasks.length<=200&&saved.tasks.every(t=>t&&typeof t.id==='string'&&typeof t.title==='string'&&['To do','In progress','Done'].includes(t.status)))projectBoard=saved;}catch(error){}
function saveProject(){try{localStorage.setItem(PROJECT_KEY,JSON.stringify(projectBoard));}catch(error){toast('Project storage unavailable. Export a CSV before leaving this tab.');}}
function todayDhaka(){return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Dhaka',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());}
function projectSummary(){const done=projectBoard.tasks.filter(t=>t.status==='Done').length,overdue=projectBoard.tasks.filter(t=>t.status!=='Done'&&t.due&&t.due<todayDhaka()).length;return {done,total:projectBoard.tasks.length,overdue,percent:projectBoard.tasks.length?Math.round(done/projectBoard.tasks.length*100):0};}
function projectCards(){const search=$('projectSearch')?.value.toLowerCase()||'',filter=$('projectFilter')?.value||'';const tasks=projectBoard.tasks.filter(t=>(!filter||t.status===filter)&&(t.title+' '+t.owner).toLowerCase().includes(search));return tasks.length?tasks.map(t=>`<article class="project-task"><div><span class="tag ${t.priority==='High'?'amber':'neutral'}">${esc(t.priority)}</span><h3>${esc(t.title)}</h3><p data-no-i18n>${esc(t.owner||'Unassigned')} · ${esc(t.due||'No due date')}${t.status!=='Done'&&t.due&&t.due<todayDhaka()?' · OVERDUE':''}</p></div><div class="project-task-controls"><select data-project-status="${esc(t.id)}" aria-label="Status">${['To do','In progress','Done'].map(s=>`<option value="${s}" ${s===t.status?'selected':''}>${s}</option>`).join('')}</select><button class="btn" data-project-edit="${esc(t.id)}">Edit</button><button class="btn danger" data-project-delete="${esc(t.id)}">Delete</button></div></article>`).join(''):'<p class="help-copy">No matching milestones.</p>';}
function updateProjectBoard(){const s=projectSummary();if($('projectTotals'))$('projectTotals').textContent=misLanguage==='bn'?`${s.total}টির মধ্যে ${s.done}টি সম্পন্ন · ${s.overdue}টি সময় পার হয়েছে`:`${s.done} of ${s.total} complete · ${s.overdue} overdue`;if($('projectProgress')){$('projectProgress').style.width=s.percent+'%';$('projectProgress').parentElement.setAttribute('aria-valuenow',s.percent);}if($('projectTaskList'))$('projectTaskList').innerHTML=projectCards();}
function showProjectBoard(){projectEditing=null;showModal(`<div class="modal-head"><div><div class="eyebrow">ENTERPRISE MIS · V3.0</div><h2 id="modalTitle">Business Project Board</h2><p class="subtitle">Turn plans into finished milestones.</p></div><button class="btn icon-btn" data-action="close" aria-label="Close">×</button></div><div class="modal-content"><label for="projectName">Project / business name</label><input id="projectName" value="${esc(projectBoard.name)}" maxlength="100"><div class="tracker-progress-head"><span id="projectTotals"></span><button class="btn" data-project-export>Export project CSV</button></div><div class="meter tracker-progress" role="progressbar" aria-label="Project completion" aria-valuemin="0" aria-valuemax="100"><span id="projectProgress"></span></div><form id="projectTaskForm" class="project-form"><div class="field full"><label for="projectTaskTitle">Milestone / task</label><input id="projectTaskTitle" required maxlength="180"></div><div><label for="projectTaskOwner">Assignee</label><input id="projectTaskOwner" maxlength="80"></div><div><label for="projectTaskDue">Due date</label><input id="projectTaskDue" type="date"></div><div><label for="projectTaskPriority">Priority</label><select id="projectTaskPriority"><option value="Normal">Normal</option><option value="High">High</option><option value="Low">Low</option></select></div><div><label for="projectTaskStatus">Status</label><select id="projectTaskStatus"><option value="To do">To do</option><option value="In progress">In progress</option><option value="Done">Done</option></select></div><button class="btn primary" id="projectSaveTask" type="submit">Add milestone</button><button class="btn" type="button" data-project-cancel>Cancel</button></form><div class="project-filter"><input id="projectSearch" placeholder="Search milestones" aria-label="Search milestones"><select id="projectFilter" aria-label="Filter project status"><option value="">All statuses</option><option value="To do">To do</option><option value="In progress">In progress</option><option value="Done">Done</option></select></div><div id="projectTaskList"></div><p class="language-note">Projects save on this device independently of simulation days. Reset Game does not remove milestones.</p></div>`);updateProjectBoard();}
function resetProjectForm(){projectEditing=null;$('projectTaskForm')?.reset();if($('projectSaveTask'))$('projectSaveTask').textContent='Add milestone';}
document.addEventListener('submit',e=>{if(e.target.id!=='projectTaskForm')return;e.preventDefault();const title=$('projectTaskTitle').value.trim();if(!title){$('projectTaskTitle').setCustomValidity('Enter a milestone title.');$('projectTaskTitle').reportValidity();return;}if(!projectEditing&&projectBoard.tasks.length>=200){toast('Keep the board focused: maximum 200 milestones.');return;}const task={id:projectEditing||'project-'+Date.now()+'-'+Math.random().toString(36).slice(2,7),title,owner:$('projectTaskOwner').value.trim(),due:$('projectTaskDue').value,priority:$('projectTaskPriority').value,status:$('projectTaskStatus').value};const idx=projectBoard.tasks.findIndex(t=>t.id===task.id);if(idx>=0)projectBoard.tasks[idx]=task;else projectBoard.tasks.push(task);saveProject();resetProjectForm();updateProjectBoard();});
document.addEventListener('input',e=>{if(e.target.id==='projectName'){projectBoard.name=e.target.value;saveProject();}if(e.target.id==='projectSearch')updateProjectBoard();if(e.target.id==='projectTaskTitle')e.target.setCustomValidity('');});
document.addEventListener('change',e=>{if(e.target.id==='projectFilter')updateProjectBoard();if(e.target.dataset.projectStatus){const task=projectBoard.tasks.find(t=>t.id===e.target.dataset.projectStatus);if(task){task.status=e.target.value;saveProject();updateProjectBoard();}}});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.hasAttribute('data-project-open'))showProjectBoard();if(b.hasAttribute('data-project-cancel'))resetProjectForm();if(b.dataset.projectEdit){const t=projectBoard.tasks.find(t=>t.id===b.dataset.projectEdit);if(t){projectEditing=t.id;$('projectTaskTitle').value=t.title;$('projectTaskOwner').value=t.owner;$('projectTaskDue').value=t.due;$('projectTaskPriority').value=t.priority;$('projectTaskStatus').value=t.status;$('projectSaveTask').textContent='Save changes';$('projectTaskTitle').focus();}}if(b.dataset.projectDelete&&confirm(tr('Delete this milestone?'))){projectBoard.tasks=projectBoard.tasks.filter(t=>t.id!==b.dataset.projectDelete);if(projectEditing===b.dataset.projectDelete)resetProjectForm();saveProject();updateProjectBoard();}if(b.hasAttribute('data-project-export')){const rows=[['Project','Milestone','Assignee','Due Date','Priority','Status'],...projectBoard.tasks.map(t=>[projectBoard.name,t.title,t.owner,t.due,t.priority,t.status])];downloadBlob(new Blob(['\uFEFF'+rows.map(r=>r.map(safeCsv).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'}),'business-lab-project-plan.csv');}});
document.querySelector('.enterprise-nav').insertAdjacentHTML('beforeend','<button class="btn" data-project-open>📌 Business Project Board</button>');
const suiteBeforeProjects=suiteMarkup;suiteMarkup=function(){return suiteBeforeProjects().replace('</div></section>','<button class="btn" data-project-open>📌 Business Project Board</button></div></section>');};
document.title='Business Lab V3.0 · Enterprise MIS & Lead-Gen';
render();localize();
</script>
