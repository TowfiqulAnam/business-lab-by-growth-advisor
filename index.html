  <!-- Simulation engine: money is represented in integer BDT. No server or build step required. -->
  <script id="simulation-engine">
  'use strict';
  const Engine = (() => {
    const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
    const channels={meta:{name:'Meta Ads',reach:7,rate:.025,conversion:.22},influencer:{name:'Influencer',reach:5,rate:.035,conversion:.25},organic:{name:'Organic',reach:3,rate:.025,conversion:.27}};
    function margin(c,price=c.price){return price-c.cost-c.pack-(c.customerPays?0:c.delivery)}
    function create(config){return {version:1,config:{...config},cash:config.capital,stock:0,rep:65,stress:12,peak:12,day:1,history:[],status:'planning',active:null,plan:{units:40,price:config.price,budget:config.marketing,channel:'meta',rest:false},lastSaved:null}}
    function demand(s,p){const ch=channels[p.channel];const reach=Math.round((240+s.rep*5+p.budget*ch.reach)*(p.rest?.85:1));const inquiries=Math.round(reach*ch.rate);const elasticity=clamp(Math.pow(s.config.price/p.price,1.7),.12,2.2);const conversion=clamp(ch.conversion*elasticity*(.6+s.rep/100)*(1-s.stress/250),.02,.8);return {reach,inquiries,orders:Math.max(0,Math.round(inquiries*conversion)),conversion}}
    function forecast(s,p){const d=demand(s,p),c=s.config;const after=s.cash-p.units*c.cost-p.budget-c.overhead;const per=c.pack+c.delivery+Math.ceil(c.delivery*.5);const cap=Math.max(0,Math.floor(after/Math.max(1,per)));const orders=Math.min(s.stock+p.units,d.orders,cap);const delivered=Math.round(orders*.9);const rto=orders-delivered;const profit=delivered*margin(c,p.price)-rto*(c.pack+c.delivery+Math.ceil(c.delivery*.5))-p.budget-c.overhead;return {...d,orders,delivered,rto,profit,after,reserve:orders*per,stock:s.stock+p.units,spend:p.units*c.cost+p.budget+c.overhead,contribution:margin(c,p.price)}}
    function validate(s,p){if(!Number.isInteger(p.units)||p.units<0||p.units>100000)return 'Enter a whole restock quantity from 0 to 100,000.';if(!Number.isInteger(p.price)||p.price<1||p.price>1000000)return 'Selling price must be ৳1–৳10,00,000 in whole taka.';if(!Number.isInteger(p.budget)||p.budget<0||p.budget>10000000)return 'Enter a valid marketing budget in whole taka.';if(!channels[p.channel])return 'Choose a marketing channel.';if(p.units*s.config.cost+p.budget+s.config.overhead>s.cash)return 'Insufficient cash. Reduce restocking or marketing; daily overhead must also be covered.';return ''}
    function begin(s,p,random=Math.random){const error=validate(s,p);if(error)throw Error(error);if(s.status!=='planning')throw Error('This day has already started.');const c=s.config,d=demand(s,p);const spend=p.units*c.cost+p.budget+c.overhead;const cashAfter=s.cash-spend;const unitReserve=c.pack+c.delivery+Math.ceil(c.delivery*.5);const wanted=Math.max(0,Math.round(d.orders*(.75+random()*.5)));const stock=s.stock+p.units;const orders=Math.min(stock,wanted,Math.max(0,Math.floor(cashAfter/Math.max(1,unitReserve))));const targetRate=.05+random()*.1;const returns=clamp(Math.round(orders*targetRate),0,orders);const eventTypes=['inbox','rider','quality','review'];const first=Math.floor(random()*4),second=(first+1+Math.floor(random()*3))%4;const active={day:s.day,plan:{...p},startCash:s.cash,startStock:s.stock,spend,restockCost:p.units*c.cost,reach:d.reach,inquiries:d.inquiries,wanted,orders,returns,targetRate,reserve:orders*unitReserve,missed:Math.max(0,wanted-orders),cashCosts:0,discount:0,writeOff:0,stressDelta:p.rest?-14:8,repDelta:0,events:[{type:eventTypes[first],at:.24,resolved:false},{type:eventTypes[second],at:.61,resolved:false}],logs:[],progress:0,price:p.price};s.cash-=spend;s.stock+=p.units;s.plan={...p};s.status='running';s.active=active;return active}
    function resolve(s,index,choice){const a=s.active;if(!a||a.events[index]?.resolved)return false;const e=a.events[index],c=s.config;const free=Math.max(0,s.cash-a.reserve);const spend=amount=>{if(free<amount)return false;s.cash-=amount;a.cashCosts+=amount;return true};let log='';
      if(e.type==='inbox'){if(choice===0){if(!spend(500))return false;a.stressDelta-=5;a.repDelta+=2;log='Temporary moderator hired · ৳500';}else{a.stressDelta+=15;a.repDelta+=1;log='You answered the inbox · +15 stress';}}
      if(e.type==='rider'){if(choice===0){a.discount+=Math.round((a.orders-a.returns)*a.price*.1);a.repDelta+=4;a.stressDelta-=3;log='Pickup delay: 10% sales discount · +4 reputation';}else{const extra=Math.min(a.orders-a.returns,Math.max(a.orders?1:0,Math.round(a.orders*.06)));a.returns+=extra;a.repDelta-=4;a.stressDelta+=7;log=`Pickup delay: ${extra} additional returns · −4 reputation`;}}
      if(e.type==='quality'){const units=Math.min(5,Math.max(0,s.stock-a.orders));if(choice===0){s.stock-=units;a.writeOff+=units*c.cost;a.repDelta+=3;a.stressDelta+=3;log=units?`QA quarantined ${units} spare units · ${units*c.cost} BDT write-off`:'QA completed: no spare stock affected · +3 reputation';}else{a.repDelta-=12;a.stressDelta+=5;log='QA skipped · −12 reputation';}}
      if(e.type==='review'){if(choice===0){a.stressDelta+=8;a.repDelta+=7;log='Personally resolved a customer complaint · +7 reputation';}else{a.stressDelta-=4;a.repDelta-=6;log='Complaint left unanswered · −6 reputation';}}
      e.resolved=true;e.choice=choice;a.logs.push(log);return true}
    function settle(s){if(s.status!=='running'||!s.active)throw Error('No active day to settle.');const a=s.active,c=s.config;for(let i=0;i<a.events.length;i++)if(!a.events[i].resolved)resolve(s,i,1);const delivered=a.orders-a.returns;const revenue=delivered*a.price-a.discount;const deliveryCollected=c.customerPays?delivered*c.delivery:0;const packaging=a.orders*c.pack;const courier=a.orders*c.delivery+a.returns*Math.ceil(c.delivery*.5);const cogs=delivered*c.cost;const profit=revenue+deliveryCollected-cogs-packaging-courier-a.plan.budget-c.overhead-a.cashCosts-a.writeOff;s.cash+=revenue+deliveryCollected-packaging-courier;s.stock-=delivered;s.rep=clamp(s.rep+a.repDelta+(delivered?2:0)-(a.missed>0?2:0)-(a.orders&&a.returns/a.orders>.15?3:0),1,100);s.stress=clamp(s.stress+a.stressDelta+(profit<0?4:-3)+(a.missed>5?4:0),0,100);s.peak=Math.max(s.peak,s.stress);const row={day:a.day,price:a.price,reach:a.reach,inquiries:a.inquiries,orders:a.orders,delivered,returns:a.returns,pending:Math.max(0,a.inquiries-a.orders),missed:a.missed,revenue,discount:a.discount,deliveryCollected,cogs,packaging,courier,marketing:a.plan.budget,overhead:c.overhead,eventCosts:a.cashCosts,writeOff:a.writeOff,profit,cash:s.cash,stock:s.stock,stockValue:s.stock*c.cost,rep:s.rep,stress:s.stress,restock:a.plan.units,restockCost:a.restockCost,startCash:a.startCash,startStock:a.startStock,channel:a.plan.channel,rest:a.plan.rest,logs:[...a.logs],cashChange:s.cash-a.startCash};s.history.push(row);s.active=null;s.status=s.cash<=0?'bankrupt':s.day>=c.duration?'complete':'report';return row}
    function totals(s){return s.history.reduce((t,r)=>{for(const key of ['revenue','profit','marketing','returns','orders','delivered','courier','missed'])t[key]+=r[key];return t},{revenue:0,profit:0,marketing:0,returns:0,orders:0,delivered:0,courier:0,missed:0})}
    function score(s){const t=totals(s),roi=t.profit/s.config.capital*100;const points=clamp(60+roi*2+(s.rep-65)*.45-(s.peak>65?(s.peak-65)*.55:0)-(s.status==='bankrupt'?65:0),0,100);return {...t,roi,points,grade:points>=90?'A+':points>=80?'A':points>=70?'B':points>=55?'C':points>=40?'D':'F'}}
    return {clamp,channels,margin,create,demand,forecast,validate,begin,resolve,settle,totals,score};
  })();
  </script>
  <script id="application">
  'use strict';
  const $=id=>document.getElementById(id), money=n=>'৳'+Math.round(n).toLocaleString('en-IN'),num=n=>Math.round(n).toLocaleString('en-IN'),esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const SAVE_KEY='business-lab-growth-advisor-v1',THEME_KEY='business-lab-theme';
  let state=null,currentView='dashboard',timer=null,toastTimer=null,lastFocus=null,liveStart=0,eventDeadline=null,activeEvent=-1,storageOkay=true;
  const sample={name:'Dhaka Everyday',category:'Fashion / Apparel',duration:7,capital:200000,product:'Everyday cotton tee',cost:320,pack:25,delivery:80,customerPays:true,price:690,overhead:650,marketing:1200};
  const roadmap=[
    {icon:'fa-brain',name:'AI Business Advisor',sub:'Your next move, backed by insight',title:'AI Business Advisor Live Audit',text:'Coming Soon: Real-time AI analysis of your unit economics and pricing elasticity.'},
    {icon:'fa-boxes-stacked',name:'Multi-product inventory',sub:'More products. A bigger picture.',title:'Multi-Product & SKU Inventory Matrix',text:'Coming Soon: Manage up to 50 products, dead-stock alerts, and supplier credit terms.'},
    {icon:'fa-building-columns',name:'Funding & crisis mode',sub:'Test your business under pressure',title:'B2B Loan, Investor Pitch & Cashflow Crisis Mode',text:'Coming Soon: Take bank SME loans, manage EMI, or pitch VCs for equity.'},
    {icon:'fa-comments',name:'CRM & retargeting',sub:'Turn conversations into customers',title:'Automated CRM & Retargeting Funnel',text:"Coming Soon: Convert 'Follow-up' customers into repeat buyers with SMS/WhatsApp campaigns."}
  ];
  function toast(text){$('toast').textContent=text;$('toast').classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.add('hidden'),4000)}
  function persist(manual=false){try{if(state){state.lastSaved=new Date().toISOString();localStorage.setItem(SAVE_KEY,JSON.stringify(state))}storageOkay=true;if(manual)toast(state?'Game saved on this browser.':'Launch your business to create a saved game.')}catch(e){storageOkay=false;toast('Browser storage unavailable. Keep this tab open and export results before leaving.')}updateSaveStatus()}
  function updateSaveStatus(){if($('saveStatus'))$('saveStatus').textContent=storageOkay?'Progress saved on this browser':'Storage unavailable — keep this tab open'}
  function load(){try{const raw=localStorage.getItem(SAVE_KEY);if(raw){const s=JSON.parse(raw);if(s.version!==1||!s.config||!Array.isArray(s.history)||!Number.isFinite(s.cash)||!Number.isFinite(s.stock)||s.stock<0||!['planning','running','report','complete','bankrupt'].includes(s.status)||![7,30].includes(s.config.duration)||s.day<1||s.day>s.config.duration)throw Error('Invalid save');for(const k of ['capital','cost','pack','delivery','price','overhead','marketing'])if(!Number.isFinite(s.config[k])||s.config[k]<0)throw Error('Invalid configuration');if(s.status==='running'&&(!s.active||!Array.isArray(s.active.events)))throw Error('Invalid operation');state=s;}if(localStorage.getItem(THEME_KEY)==='dark')document.body.classList.add('dark-mode')}catch(e){toast('Saved game could not be loaded. You can start a new business.')}}
  function footer(){return `<footer class="footer"><span>Business Lab by Growth Advisor · Build instincts. Make better decisions.</span><span id="saveStatus">${storageOkay?'Progress saved on this browser':'Storage unavailable — keep this tab open'}</span><button data-action="privacy">Data & privacy</button></footer>`}
  function render(){document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===currentView));$('crumb').textContent=!state?'Business setup':({dashboard:'Business overview',reports:'Daily reports',summary:'Advisor scorecard',roadmap:'Enterprise lab'}[currentView]);if(!state&&currentView!=='roadmap')renderSetup();else if(currentView==='dashboard')renderDashboard();else if(currentView==='reports')renderReports();else if(currentView==='summary')renderSummary();else renderRoadmap();}
  function field(id,label,value,opts={}){return `<div class="field ${opts.full?'full':''}"><label for="${id}">${label}</label><input id="${id}" name="${id}" type="${opts.type||'number'}" value="${esc(value)}" ${opts.type==='text'?'maxlength="65"':`min="${opts.min??0}" max="${opts.max??1000000}" step="1"`} required>${opts.hint?`<small>${opts.hint}</small>`:''}</div>`}
  function renderSetup(){const c={...sample,name:'',product:'',capital:100000};$('app').innerHTML=`<div class="page-head"><div><div class="eyebrow">THE FOUNDER EXPERIENCE</div><h1>Big ambition. First decision.</h1><p class="subtitle">Build a business. Run the day. Learn by doing.</p></div><span class="tag"><span class="dot"></span> SETUP / 01</span></div><div class="setup-grid"><section class="panel"><div class="panel-head"><h2>Make it your business</h2><button class="btn" data-action="sample"><i class="fa-solid fa-bolt"></i> Load sample</button></div><form id="setupForm" class="panel-body"><div class="form-section"><h3><span class="section-number">01</span> The foundation</h3><div class="form-grid">${field('businessName','Business name','',{type:'text',full:true})}<div class="field full"><label for="category">Business category</label><select id="category"><option>Fashion / Apparel</option><option>F-Commerce Gadget Store</option><option>Homemade Food / Cloud Kitchen</option><option>FMCG</option></select></div><div class="field full"><label>Choose your simulation</label><div class="segmented"><label><input type="radio" name="duration" value="7" checked> 7-day sprint</label><label><input type="radio" name="duration" value="30"> 30-day full month</label></div></div>${field('capital','Starting capital (BDT)',c.capital,{min:100000,max:1000000,full:true,hint:'Choose from ৳1,00,000 to ৳10,00,000. No loans, no shortcuts.'})}</div></div><div class="form-section"><h3><span class="section-number">02</span> The unit economics</h3><div class="form-grid">${field('product','Product name','',{type:'text',full:true})}${field('cost','Buying / making cost (৳)',c.cost,{min:1})}${field('pack','Packaging per unit (৳)',c.pack)}${field('delivery','Courier per order (৳)',c.delivery)}${field('price','Selling price (৳)',c.price,{min:1})}<div class="field full"><label for="customerPays">Who pays the delivery charge?</label><select id="customerPays"><option value="yes">Customer pays on delivered orders</option><option value="no">Business absorbs it (free delivery)</option></select></div>${field('overhead','Fixed daily overhead (৳)',c.overhead,{hint:'Labour, staff, rent & utilities.'})}${field('marketing','Daily marketing budget (৳)',c.marketing,{hint:'Your starting plan; adjustable each day.'})}</div></div><p class="help-copy">A hands-on learning simulation with same-day cash settlement. One product, one unit per order. Figures are illustrative, not market predictions.</p><p class="error" id="setupError" role="alert"></p><button class="btn primary block mt" type="submit">Open for business <i class="fa-solid fa-arrow-right"></i></button><p class="subtitle" style="text-align:center">No signup. No payments. Your progress stays in this browser.</p></form></section><aside><div class="setup-preview"><div class="eyebrow">KNOW YOUR NUMBERS</div><h2>A good business starts<br>with a healthy margin.</h2><div id="marginPreview"></div><div class="preview-steps"><div class="preview-step"><span>1</span><div><b>Plan your day</b><small>Balance stock, pricing, and growth.</small></div></div><div class="preview-step"><span>2</span><div><b>Step into the operations room</b><small>18 seconds. Real decisions. Real tradeoffs.</small></div></div><div class="preview-step"><span>3</span><div><b>Learn. Adjust. Show up again.</b><small>Turn your daily reports into a better tomorrow.</small></div></div></div></div><div class="notice"><i class="fa-solid fa-lightbulb"></i> Presenting in a meeting? <b>Load sample</b> fills a ready-to-run Dhaka apparel business.</div></aside></div>${footer()}`;$('setupForm').addEventListener('input',updateMargin);$('setupForm').addEventListener('change',updateMargin);$('setupForm').addEventListener('submit',launchBusiness);updateMargin();}
  function readSetup(){return {name:$('businessName').value.trim(),category:$('category').value,duration:Number(document.querySelector('[name=duration]:checked').value),capital:+$('capital').value,product:$('product').value.trim(),cost:+$('cost').value,pack:+$('pack').value,delivery:+$('delivery').value,customerPays:$('customerPays').value==='yes',price:+$('price').value,overhead:+$('overhead').value,marketing:+$('marketing').value}}
  function updateMargin(){const c=readSetup(),m=Engine.margin(c),pct=c.price>0?m/c.price*100:0;$('marginPreview').innerHTML=`<div class="margin-value" style="${m<0?'color:#ffb7bd':''}">${money(m)}</div><small>Gross contribution per delivered unit</small><div class="preview-line" style="margin-top:17px"><span>Contribution margin</span><b>${pct.toFixed(1)}%</b></div><div class="preview-line"><span>Daily overhead + marketing</span><b>${money(c.overhead+c.marketing)}</b></div><div class="preview-line"><span>Break-even deliveries / day</span><b>${m>0?num(Math.ceil((c.overhead+c.marketing)/m)):'Not attainable'}</b></div><p style="font-size:10px;color:#b8cbb0;margin-top:15px">After product, packaging, and business-paid delivery. Break-even excludes returns and events.${m<=0?' Increase your price or reduce your unit costs before launch.':''}</p>`;}
  function launchBusiness(e){e.preventDefault();if(!$('setupForm').reportValidity())return;const c=readSetup();if(!c.name||!c.product){$('setupError').textContent='Enter a business and product name.';return}if(c.overhead+c.marketing>c.capital){$('setupError').textContent='Daily overhead and marketing exceed your starting capital.';return}state=Engine.create(c);state.plan.units=Math.min(40,Math.max(0,Math.floor((c.capital-c.overhead-c.marketing)*.35/c.cost)));currentView='dashboard';persist();render();window.scrollTo(0,0);toast('You’re open for business. Plan your first day.');}
  function proCards(){return `<div class="pro-grid">${roadmap.map((p,i)=>`<button class="pro-card" data-pro="${i}" title="${esc(p.text)}"><div class="pro-top"><i class="fa-solid ${p.icon}"></i><span class="pro-tag">COMING SOON ↗</span></div><b>${p.name}</b><small>${p.sub}</small></button>`).join('')}</div>`}
  function renderDashboard(){const s=state,c=s.config,t=Engine.totals(s),finished=['complete','bankrupt'].includes(s.status);$('app').innerHTML=`<div class="page-head"><div><div class="eyebrow">YOUR BUSINESS, IN MOTION</div><h1>${esc(c.name)}<span style="color:#80a86d">.</span></h1><p class="subtitle">${esc(c.category)} <span style="margin:0 6px">/</span> ${esc(c.product)}</p></div><div class="head-action"><span class="tag ${finished?'amber':''}"><span class="dot"></span> ${finished?'RUN COMPLETE':`DAY ${s.day} OF ${c.duration}`}</span><div class="subtitle" style="font-size:10px">${finished?'Time to reflect & grow':'Every decision compounds.'}</div></div></div><div class="stats"><article class="panel stat"><div class="stat-top">Cash balance <span class="stat-icon"><i class="fa-solid fa-wallet"></i></span></div><div class="stat-value">${money(s.cash)}</div><div class="stat-foot"><span class="${t.profit>=0?'positive':'negative'}">${t.profit>=0?'+':''}${money(t.profit)}</span> cumulative net profit</div></article><article class="panel stat"><div class="stat-top">Inventory <span class="stat-icon"><i class="fa-solid fa-box"></i></span></div><div class="stat-value">${num(s.stock)} <span style="font-size:12px;font-weight:400;color:var(--muted)">units</span></div><div class="stat-foot">${money(s.stock*c.cost)} at purchase cost</div></article><article class="panel stat"><div class="stat-top">Brand reputation <span class="stat-icon"><i class="fa-regular fa-star"></i></span></div><div class="stat-value">${s.rep}<span style="font-size:15px">%</span></div><div class="meter"><span style="width:${s.rep}%"></span></div><div class="stat-foot">${s.rep>=75?'Customers are becoming advocates':s.rep>=50?'Building trust, one delivery at a time':'Customer trust needs attention'}</div></article><article class="panel stat"><div class="stat-top">Founder stress <span class="stat-icon" style="color:var(--amber)"><i class="fa-solid fa-heart-pulse"></i></span></div><div class="stat-value ${s.stress>70?'negative':'warning'}">${s.stress}<span style="font-size:15px">%</span></div><div class="meter"><span style="width:${s.stress}%;background:${s.stress>70?'var(--rose)':'#d9ad58'}"></span></div><div class="stat-foot">${s.stress>70?'Protect your energy. Plan a lighter day.':'A sustainable pace beats a burnout sprint.'}</div></article></div><div class="dashboard-grid"><div class="stack"><section class="panel"><div class="panel-head"><h2>${finished?'Your run is complete':`Let’s plan day ${s.day}`}</h2><span class="tag neutral"><i class="fa-regular fa-clipboard"></i> ${finished?'FINISHED':'DAILY PLAYBOOK'}</span></div><div class="panel-body">${finished?`<p class="help-copy">${s.status==='bankrupt'?'Your cash runway has ended.':'You showed up and completed your simulation.'} Review your advisor scorecard to see what worked and where to improve.</p><button class="btn primary block mt" data-view="summary">View advisor scorecard <i class="fa-solid fa-arrow-right"></i></button>`:s.status==='report'?`<p class="help-copy">Day ${s.day} is in the books. Review the numbers before making your next decision.</p><button class="btn primary block mt" data-action="latestReport">Review day ${s.day} <i class="fa-solid fa-arrow-right"></i></button>`:s.status==='running'?`<p class="help-copy">Your day is in progress. Resume operations to resolve incoming decisions.</p><button class="btn primary block mt" data-action="resume">Return to operations</button>`:planningForm()}</div></section><section class="panel"><div class="panel-head"><h2 style="font-size:14px">Your founder journey</h2><span class="muted" style="font-size:10px">${s.history.length} / ${c.duration} days complete</span></div><div class="panel-body"><div class="journey"><span><i class="fa-solid fa-flag-checkered positive"></i> ${c.duration===7?'Build the habit':'Build the consistency'}</span><b>${Math.round(s.history.length/c.duration*100)}%</b></div><div class="progress-track">${Array.from({length:c.duration},(_,i)=>`<span class="${i<s.history.length?'done':i===s.history.length?'current':''}" title="Day ${i+1}"></span>`).join('')}</div></div></section></div><div class="stack"><section class="panel forecast"><div class="panel-head"><h2 style="font-size:14px"><i class="fa-solid fa-wand-magic-sparkles" style="margin-right:6px"></i> ${finished?'Run at a glance':'Tomorrow starts with a forecast'}</h2></div><div class="panel-body" id="forecastBody"></div></section><section class="panel"><div class="panel-head"><h2 style="font-size:14px">The bigger picture</h2><span class="muted" style="font-size:9px">DAILY PERFORMANCE</span></div>${chartMarkup()}</section></div></div><section class="roadmap-strip"><div class="roadmap-title"><h2><i class="fa-solid fa-flask" style="color:var(--green);margin-right:7px"></i> The next level of your business</h2><span class="tag neutral">PRO · COMING SOON</span></div>${proCards()}</section>${footer()}`;if($('planForm')){$('planForm').addEventListener('input',planChanged);$('planForm').addEventListener('change',planChanged);$('planForm').addEventListener('submit',startDay);}updateForecast();}
  function planningForm(){const p=state.plan;return `<form id="planForm"><div class="plan-row"><div><h3><span class="section-number">01</span> Restock / production</h3><p>Add inventory at ${money(state.config.cost)} per unit.</p></div><div class="input-unit"><label class="hidden" for="planUnits">Units to restock</label><input id="planUnits" type="number" min="0" max="100000" step="1" required value="${p.units}"><span>units</span></div></div><div class="plan-row"><div><h3><span class="section-number">02</span> Set your selling price</h3><p>Find the balance between margin and demand.</p></div><div class="input-unit"><label class="hidden" for="planPrice">Selling price</label><input id="planPrice" type="number" min="1" max="1000000" step="1" required value="${p.price}"><span>BDT</span></div></div><div class="plan-row"><div><h3><span class="section-number">03</span> Invest in growth</h3><p id="reachHint">Your marketing builds tomorrow’s pipeline.</p></div><div class="input-unit"><label class="hidden" for="planBudget">Marketing spend</label><input id="planBudget" type="number" min="0" max="10000000" step="1" required value="${p.budget}"><span>BDT</span></div><div class="full" style="margin-top:-12px"><div class="channel-row" role="group" aria-label="Marketing channel">${Object.entries(Engine.channels).map(([key,v])=>`<button type="button" class="channel ${p.channel===key?'active':''}" data-channel="${key}" aria-pressed="${p.channel===key}"><i class="${key==='meta'?'fa-brands fa-facebook':key==='influencer'?'fa-solid fa-bullhorn':'fa-solid fa-leaf'}" style="margin-right:5px"></i> ${v.name}</button>`).join('')}</div></div></div><label style="display:flex;align-items:center;gap:9px;font-size:11px;margin:16px 0 0;font-weight:500"><input type="checkbox" id="planRest" ${p.rest?'checked':''}> Protect a recovery break <span class="muted">−15% reach, lower stress</span></label><div class="plan-summary"><span>Upfront commitment <small style="display:block;font-size:9px">Stock + marketing + fixed overhead</small></span><b id="planSpend"></b></div><p id="planError" class="error" role="alert"></p><div class="launch-row"><small><i class="fa-regular fa-clock"></i> An 18-second live day. Stay ready for founder decisions.</small><button class="btn primary" type="submit" id="startButton">Start day ${state.day} operations <i class="fa-solid fa-arrow-right"></i></button></div></form>`}
  function readPlan(){return {units:$('planUnits').value===''?NaN:+$('planUnits').value,price:$('planPrice').value===''?NaN:+$('planPrice').value,budget:$('planBudget').value===''?NaN:+$('planBudget').value,channel:state.plan.channel,rest:$('planRest').checked}}

  function updateForecast(p=state.plan){const finished=['complete','bankrupt'].includes(state.status);if(finished){const t=Engine.score(state);$('forecastBody').innerHTML=`<span class="muted" style="font-size:11px">TOTAL NET ${t.profit<0?'LOSS':'PROFIT'}</span><div class="forecast-range ${t.profit<0?'negative':'positive'}">${money(t.profit)}</div><div class="forecast-grid"><div><small>Return on starting capital</small><b>${t.roi.toFixed(1)}%</b></div><div><small>Delivered orders</small><b>${num(t.delivered)}</b></div></div><div class="coach"><i class="fa-solid fa-seedling"></i><span>Experience becomes insight when you reflect. Your advisor scorecard is ready.</span></div>`;return}const error=Engine.validate(state,p),safe=Number.isFinite(p.price)&&p.price>0&&Number.isFinite(p.units)&&Number.isFinite(p.budget);if(!safe){$('forecastBody').innerHTML='<p class="help-copy">Enter valid numbers to see your forecast.</p>';if($('planError')){$('planError').textContent=error;$('startButton').disabled=true}return}const f=Engine.forecast(state,p),c=state.config;let advice=f.contribution<=0?'Your selling price does not cover unit costs. Every delivery compounds the loss.':f.stock===0?'Start with a small batch. No inventory means no orders can be fulfilled.':f.stock<f.orders*1.2?'Keep a small stock buffer so demand does not turn into missed sales.':f.profit<0?'Your forecast is negative. Try reducing marketing or increasing your contribution margin.':state.stress>65?'A recovery break can protect tomorrow’s conversion rate. Sustainable growth includes you.':'Healthy unit economics give you room to grow. Start lean and adjust after your first report.';$('forecastBody').innerHTML=`<span style="font-size:10px;color:var(--muted)">PROJECTED NET PROFIT · DAY ${state.day}</span><div class="forecast-range ${f.profit<0?'negative':'positive'}">${money(f.profit)}</div><span style="font-size:10px;color:var(--muted)">An estimate, not a promise. Events can change the day.</span><div class="foreca   function chartMarkup(){const rows=state.history;if(!rows.length)return `<div class="empty-chart"><i class="fa-solid fa-chart-line"></i>Your first data point is one decision away.<br><span style="font-size:10px">Revenue and profit appear after day 1.</span><svg class="chart" style="height:65px" viewBox="0 0 400 65" aria-hidden="true"><path d="M0 50 Q60 50 90 37 T180 38 T270 20 T400 8" fill="none" stroke="#b2c7a8" stroke-width="2" stroke-dasharray="5 5"/></svg></div>`;const width=440,height=145,pad=25,min=Math.min(0,...rows.map(r=>r.profit)),max=Math.max(1,...rows.map(r=>r.revenue)),range=max-min,x=i=>pad+i*(width-2*pad)/Math.max(1,rows.length-1),y=n=>height-pad-(n-min)/range*(height-pad*2);const path=key=>rows.map((r,i)=>`${i?'L':'M'}${x(i)},${y(r[key])}`).join(' ');return `<div class="chart-wrap"><svg class="chart" viewBox="0 0 440 145" role="img" aria-label="Revenue and net profit across ${rows.length} days. Detailed values are available in Daily reports."><line x1="25" y1="${y(0)}" x2="415" y2="${y(0)}" stroke="var(--line)"/><path d="${path('revenue')}" fill="none" stroke="#96ae68" stroke-width="2.5"/><path d="${path('profit')}" fill="none" stroke="#1a805b" stroke-width="2.5"/>${rows.map((r,i)=>`<circle cx="${x(i)}" cy="${y(r.profit)}" r="3" fill="${r.profit<0?'#bd4055':'#1a805b'}"><title>Day ${r.day}: revenue ${money(r.revenue)}, profit ${money(r.profit)}</title></circle>`).join('')}<text x="25" y="140" fill="var(--muted)" font-size="9">DAY 1</text><text x="380" y="140" fill="var(--muted)" font-size="9">DAY ${rows.length}</text></svg></div><div class="chart-legend"><span><i class="dot" style="background:#96ae68"></i> Revenue</span><span><i class="dot" style="background:#1a805b"></i> Net profit</span><span style="margin-left:auto">BDT ৳</span></div>`}
  function showModal(html,small=false){lastFocus=document.activeElement;$('modalRoot').innerHTML=`<div class="modal-backdrop"><section class="modal ${small?'small':''}" role="dialog" aria-modal="true" aria-labelledby="modalTitle" tabindex="-1">${html}</section></div>`;document.body.style.overflow='hidden';$('modalRoot').querySelector('.modal').focus()}

  function eventInfo(type){const c=state.config,a=state.active;const units=Math.min(5,Math.max(0,state.stock-a.orders));return {inbox:{title:'“Price please?” Your inbox is overflowing.',text:'Comments are piling up faster than you can reply. How will you keep up?',options:[['Hire a temporary moderator','৳500 · −5 stress · +2 reputation'],['Reply to every message yourself','+15 stress · +1 reputation']],cost:500},rider:{title:'The courier rider missed the pickup.',text:'Your Pathao / Steadfast pickup is delayed. Customers are asking for an update.',options:[['Offer a goodwill discount','10% of product sales · +4 reputation'],['Keep the price. Risk cancellations.','Extra returns · +7 stress · −4 reputation']],cost:0},quality:{title:'QA flags a supplier batch issue.',text:units?`${units} spare units have defects. These are not part of today’s dispatched orders.`:'Your packed orders passed QA. There is no spare inventory to write off, but customers still expect quality checks.',options:[['Quarantine affected stock',`${money(units*c.cost)} inventory write-off · +3 reputation`],['Skip QA and keep the stock','−12 reputation · +5 stress']],cost:0},review:{title:'A frustrated customer leaves a comment.',text:'They need a personal response. Your next decision will shape customer trust.',options:[['Call and listen personally','+8 stress · +7 reputation'],['Leave it for another day','−4 stress · −6 reputation']],cost:0}}[type]}
  function showOperations(){if(state.status!=='running')return;const a=state.active;showModal(`<div class="modal-head"><div><div class="eyebrow">THE OPERATIONS ROOM</div><h2 id="modalTitle">Day ${a.day}: you’re in business.</h2><p class="subtitle">Stay present. A founder’s decisions make the difference.</p></div><button class="btn icon-btn" data-action="pause" aria-label="Pause operations" title="Pause and save"><i class="fa-solid fa-pause"></i></button></div><div class="modal-content"><div class="live-banner"><span class="tag"><span class="live-dot"></span> LIVE OPERATIONS</span><span class="muted" style="font-size:11px" id="liveClock">18 seconds remaining</span></div><div class="meter" style="height:7px"><span id="liveProgress" style="width:0%"></span></div><div class="pipeline">${[['fa-comments','Incoming inquiries'],['fa-bag-shopping','Orders confirmed'],['fa-box-open','Packaging & QA'],['fa-truck-fast','Out for delivery']].map(([icon,label],i)=>`<div class="pipe" id="pipe${i}"><i class="fa-solid ${icon}"></i><b id="count${i}">0</b><small>${label}</small></div>`).join('')}</div><div class="event-box" id="eventBox" aria-live="polite"><span class="tag neutral"><i class="fa-solid fa-inbox"></i> FOUNDER INBOX</span><h3>A little focus goes a long way.</h3><p>Orders are moving through your business. Watch for operational decisions here.</p></div><div class="event-log" id="eventLog"></div><p class="subtitle" style="font-size:10px">Simulation time pauses when this tab is hidden. Unanswered events use the second option after 5 seconds.</p></div>`);liveStart=performance.now()-a.progress*18000;eventDeadline=null;activeEvent=-1;timer=setInterval(tickOperations,80);tickOperations();}
  let lastTick=0;
  function tickOperations(){if(!state?.active||!$('liveProgress'))return;const now=performance.now();if(document.hidden){liveStart+=lastTick?now-lastTick:80;if(eventDeadline)eventDeadline+=lastTick?now-lastTick:80;lastTick=now;return}lastTick=now;const a=state.active;a.progress=Math.min(1,(now-liveStart)/18000);$('liveProgress').style.width=a.progress*100+'%';$('liveClock').textContent=`${Math.max(0,Math.ceil(18*(1-a.progress)))} seconds remaining`;const totals=[a.inquiries,a.orders,a.orders,a.orders];totals.forEach((v,i)=>{const p=Engine.clamp((a.progress-i*.13)/(.55),0,1);$('count'+i).textContent=num(Math.round(v*p));$('pipe'+i).classList.toggle('running',p>0&&p<1)});if(activeEvent<0){const idx=a.events.findIndex(e=>!e.resolved&&a.progress>=e.at);if(idx>=0){activeEvent=idx;eventDeadline=now+5000;renderEvent(idx)}}if(activeEvent>=0){const left=Math.max(0,Math.ceil((eventDeadline-now)/1000));if($('eventTimer'))$('eventTimer').textContent=left+'s to decide';if(now>=eventDeadline)chooseEvent(activeEvent,1,true)}if(a.progress>=1&&activeEvent<0){clearInterval(timer);timer=null;const r=Engine.settle(state);persist();render();showReport(r,true);}}
  function renderEvent(index){const info=eventInfo(state.active.events[index].type);const affordable=state.cash-state.active.reserve>=info.cost;$('eventBox').classList.add('urgent');$('eventBox').innerHTML=`<div style="display:flex;justify-content:space-between;gap:10px"><span class="tag amber"><i class="fa-solid fa-bolt"></i> DECISION ${index+1} / 2</span><span class="tag amber" id="eventTimer">5s to decide</span></div><h3>${info.title}</h3><p>${info.text}</p><div class="event-options">${info.options.map(([title,sub],i)=>`<button class="btn ${i===0?'primary':''}" data-event="${index}" data-choice="${i}" ${i===0&&!affordable?'disabled':''}>${title}<small>${i===0&&!affordable?'Insufficient unreserved cash':sub}</small></button>`).join('')}</div>`}

  function lessons(s,t){const out=[];if(t.marketing>t.revenue*.22)out.push(['Make each marketing taka work harder.',`Marketing consumed ${t.revenue?(t.marketing/t.revenue*100).toFixed(0):100}% of product revenue. Test smaller budgets and judge spend by delivered-order profit, not reach.`]);else out.push(['Scale what pays back.',`Your marketing cost was ${t.delivered?money(t.marketing/t.delivered):money(t.marketing)} per delivered order. Increase budgets gradually while protecting contribution margin.`]);if(t.orders&&t.returns/t.orders>.12)out.push(['Fix returns before buying more traffic.',`${(t.returns/t.orders*100).toFixed(1)}% of orders returned. Confirm orders and addresses, set delivery expectations, and track courier performance.`]);else if(t.missed>5)out.push(['Plan stock and dispatch cash together.',`${t.missed} orders went unfulfilled. Use recent demand to restock and keep enough cash for packaging and round-trip courier costs.`]);else if(s.stock*s.config.cost>s.config.capital*.3)out.push(['Cash tied up in stock cannot pay tomorrow’s bills.',`${money(s.stock*s.config.cost)} remains in inventory. Buy in smaller batches until your sales pace justifies larger purchases.`]);else out.push(['Keep your cash and profit views separate.',`${money(s.stock*s.config.cost)} is still tied up in stock. Use a rolling forecast and keep an overhead buffer before committing to your next batch.`]);if(s.peak>70)out.push(['Build a business you can sustain.',`Stress peaked at ${s.peak}%. Protect recovery breaks and delegate inbox work before stress reduces your ability to convert customers.`]);else if(s.rep<55)out.push(['Customer trust is working capital.',`Reputation finished at ${s.rep}%. Resolve complaints and keep quality checks consistent; short-term savings can reduce future demand.`]);else out.push(['Consistency is an operating advantage.',`You completed ${s.history.length} days with ${s.rep}% reputation. Keep a daily review habit: forecast, operate, compare, and change one decision at a time.`]);return out;}
  function renderSummary(){const s=state,t=Engine.score(s),finished=['complete','bankrupt'].includes(s.status);$('app').innerHTML=`<div class="page-head"><div><div class="eyebrow">BUSINESS ADVISOR SCORECARD</div><h1>${finished?'Experience. Turned into insight.':'A check-in on your progress.'}</h1><p class="subtitle">${esc(s.config.name)} · ${s.history.length} of ${s.config.duration} days completed ${finished?'':'· Provisional score'}</p></div><button class="btn" data-action="export"><i class="fa-solid fa-download"></i> Export</button></div><div class="score-hero"><div class="grade">${s.history.length?t.grade:'—'}</div><div><span style="font-size:9px;letter-spacing:1.5px;color:#b2c797">YOUR BUSINESS COACH GRADE</span><h2>${s.status==='bankrupt'?'A hard lesson. A stronger next start.':t.profit>0?'You built momentum. Keep learning.':'Every experiment teaches you something.'}</h2><p>${s.status==='bankrupt'?'The business ran out of cash or could not fund another day’s overhead.':finished?'You completed the run. Here is what your decisions created.':'Your score evolves as you operate. Finish the run for your final assessment.'}</p></div></div><div class="summary-stats">${[['Total product revenue',money(t.revenue),'Delivered sales, after discounts'],['Total net profit',money(t.profit),'All expenses and write-offs included'],['Return on capital',t.roi.toFixed(1)+'%','Net profit ÷ starting capital'],['Final cash',money(s.cash),'Cash available in the business'],['Unsold inventory',money(s.stock*s.config.cost),num(s.stock)+' units at purchase cost'],['Peak founder stress',s.peak+'%','Highest end-of-day stress']].map(([label,value,sub])=>`<div class="panel stat"><div class="stat-top">${label}</div><div class="stat-value">${value}</div><div class="stat-foot">${sub}</div></div>`).join('')}</div><section class="panel mt"><div class="panel-head"><h2>Three lessons to take into your next chapter</h2><span class="tag">ADVISOR NOTES</span></div><div class="panel-body">${lessons(s,t).map(([title,text])=>`<div class="lesson"><i class="fa-regular fa-circle-check"></i><div><h3>${title}</h3><p>${text}</p></div></div>`).join('')}<p class="help-copy" style="font-size:10px;margin-top:16px">Grade = 60 + 2 × ROI percentage + 0.45 × (reputation − 65), with penalties for peak stress above 65 and bankruptcy. A+ ≥ 90, A ≥ 80, B ≥ 70, C ≥ 55, D ≥ 40, otherwise F. This is a learning score, not a business valuation.</p></div></section><div class="launch-row"><button class="btn" data-view="reports">Explore daily reports</button>${finished?'<button class="btn primary" data-action="reset">Start a new chapter <i class="fa-solid fa-arrow-right"></i></button>':'<button class="btn primary" data-view="dashboard">Back to your business <i class="fa-solid fa-arrow-right"></i></button>'}</div>${footer()}`}

  function exportCSV(){if(!state?.history.length){toast('Complete at least one day to export your results.');return}const keys=['day','price','reach','inquiries','orders','delivered','returns','pending','missed','revenue','discount','deliveryCollected','cogs','packaging','courier','marketing','overhead','eventCosts','writeOff','profit','startCash','cashChange','cash','restock','restockCost','stock','stockValue','rep','stress','channel','rest','logs'];const quote=x=>'"'+String(x??'').replace(/"/g,'""')+'"';const csv='\uFEFF'+keys.map(quote).join(',')+'\r\n'+state.history.map(r=>keys.map(k=>quote(Array.isArray(r[k])?r[k].join(' | '):r[k])).join(',')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));const a=document.createElement('a');a.href=url;a.download='business-lab-results.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Results exported as CSV.');}

  @keyframes demoGlow{50%{box-shadow:0 0 0 5px #97bc7020,0 0 22px #97bc7030}}@keyframes storeTravel{0%{transform:translateX(0);opacity:0}15%{opacity:1}70%{opacity:1}100%{transform:translateX(var(--travel,200px));opacity:0}}@keyframes parcelTravel{0%{transform:translateX(0) scale(.8);opacity:0}20%{opacity:1}100%{transform:translateX(var(--travel,150px));opacity:0}}@keyframes paymentFloat{0%{opacity:0;transform:translateY(15px)}20%{opacity:1}100%{opacity:0;transform:translateY(-65px)}}@keyframes profitGlow{50%{box-shadow:0 0 22px #359e4f33}}@keyframes steadyPulse{50%{box-shadow:0 0 0 4px #d8b26722}}@keyframes lossPulse{50%{box-shadow:inset 0 0 20px #bd405522}}@keyframes lossShake{20%,60%{transform:translateX(-3px)}40%,80%{transform:translateX(3px)}}@keyframes trophyBounce{50%{transform:translateY(-5px) rotate(-7deg)}}@keyframes confettiFall{to{transform:translateY(180px) rotate(240deg);opacity:0}}
  .task-badge{flex-shrink:0;white-space:nowrap}
  @media(max-width:1150px){.topbar{height:auto;min-height:75px;padding-top:12px;padding-bottom:12px;flex-wrap:wrap}.top-actions{flex-wrap:wrap}.tracker-trigger{font-size:11px}.launch-row .primary{width:100%}}
  @media(max-width:650px){.topbar{gap:10px}.top-actions{width:100%;display:grid;grid-template-columns:1fr 40px 40px 40px}.tracker-trigger{grid-column:1;grid-row:1;padding:8px;font-size:10px}.top-actions .btn.icon-btn,.top-actions>.btn:not(.tracker-trigger){padding:8px}.top-actions>.btn:nth-child(1){grid-column:2;grid-row:1}.top-actions>.btn:nth-child(2){grid-column:3;grid-row:1}.top-actions>.btn:nth-child(3){grid-column:4;grid-row:1}.setup-grid .panel-head{align-items:stretch}.demo-cta{max-width:none;width:100%;font-size:13px}.hero-hook{font-size:28px}.page-head:has(.hero-hook){flex-direction:column}.panel-head h2{font-size:17px}.plan-row h3{font-size:13px}.plan-row .section-number{margin-right:4px}.tracker-heading{font-size:14px!important}.task-row{padding:9px}.task-row label{font-size:12px}.task-add{flex-wrap:wrap}.task-add input{flex-basis:100%}.task-add .btn{width:100%}.signature{align-items:flex-start;padding:13px;gap:9px}.signature-copy{font-size:10px}.signature-seal{width:29px;height:32px}.store-title{align-items:flex-start;flex-wrap:wrap}.celebration h3{font-size:17px}.btn.primary{font-size:13px}}
  @media(prefers-reduced-motion:reduce){.customer-token,.parcel-token,.payment-token{animation:none;display:none}.demo-cta,.celebration,.celebrate-icon,.confetti-bit{animation:none!important}.confetti-bit{display:none}}

<script id="experience-upgrade">
'use strict';
// This layer changes presentation only. Tasks use their own key, never the simulation save.
const TASK_KEY='business-lab-nightly-tasks-v1';
const nightlyDefaults=["Audit today's ad spend & ROAS","Follow up with pending inbox leads","Check stock levels for tomorrow","Review courier return (RTO) reasons","Plan tomorrow's marketing offer"];
let nightlyTasks=nightlyDefaults.map((text,i)=>({id:'habit-'+i,text,done:false,custom:false}));
let taskStorageAvailable=true;
try{const savedTasks=JSON.parse(localStorage.getItem(TASK_KEY)||'null');if(Array.isArray(savedTasks)&&savedTasks.length<=100&&savedTasks.every(t=>t&&typeof t.id==='string'&&typeof t.text==='string'&&t.text.length<=180&&typeof t.done==='boolean')&&new Set(savedTasks.map(t=>t.id)).size===savedTasks.length)nightlyTasks=savedTasks;}catch(e){taskStorageAvailable=false;}
function saveTasks(){try{localStorage.setItem(TASK_KEY,JSON.stringify(nightlyTasks));taskStorageAvailable=true;}catch(e){taskStorageAvailable=false;toast('Checklist storage is unavailable. Changes will last only while this tab is open.');}syncTaskIndicators();}
function taskStats(){const done=nightlyTasks.filter(t=>t.done).length;return {done,total:nightlyTasks.length,pending:nightlyTasks.length-done,percent:nightlyTasks.length?Math.round(done/nightlyTasks.length*100):0};}
function taskBadge(){const t=taskStats();return `<span class="task-badge ${t.pending?'pending':''}" data-task-badge aria-label="${t.pending} unfinished tasks">🔔 ${t.pending}</span>`;}
function signature(){return `<footer class="signature" aria-label="Developer and ownership credit"><span class="signature-seal" aria-hidden="true">✦</span><div><div class="signature-kicker">BUSINESS LAB · PRODUCT SIGNATURE</div><div class="signature-copy">Developer Name: Towfiqul Anam | Company Name: Growth Advisor | Contact: <a href="tel:01856084266">01856084266</a> / <a href="mailto:towfiqul.anam@gmail.com">towfiqul.anam@gmail.com</a> / FB: Growth Advisor</div></div></footer>`;}
const originalFooter=footer;
footer=function(){return originalFooter()+signature();};
function taskRows(){return nightlyTasks.map(t=>`<li class="task-row ${t.done?'done':''}"><label><input type="checkbox" data-task-id="${esc(t.id)}" ${t.done?'checked':''}><span class="task-text">${esc(t.text)}</span></label>${t.custom?`<button class="task-remove" data-remove-task="${esc(t.id)}" aria-label="Remove task: ${esc(t.text)}" title="Remove custom task">×</button>`:''}</li>`).join('');}
function trackerMarkup(compact=false){const t=taskStats();return `<div class="tracker-widget"><p class="help-copy">Close today with clarity. Set tomorrow up to win.</p><div class="tracker-progress-head"><span data-task-fraction>${t.done} of ${t.total} habits complete</span><span data-task-percent>${t.percent}%</span></div><div class="meter tracker-progress" role="progressbar" aria-label="Nightly plan completion" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${t.percent}"><span style="width:${t.percent}%"></span></div>${compact?`<p class="subtitle">${t.pending?'Your nightly action plan is waiting.':'All tasks complete. You showed up for your business!'} Tasks are independent of your simulation day.</p><button class="btn primary mt" data-nightly-open>📋 Open My Nightly Action Plan ${taskBadge()}</button>`:`<ul class="task-list">${taskRows()}</ul><form class="task-add"><label class="hidden" for="nightlyTaskInput">New nightly task</label><input id="nightlyTaskInput" name="task" maxlength="180" placeholder="Add your next business-building action…" required autocomplete="off"><button class="btn primary" type="submit">＋ Add My Task</button></form><div class="tracker-tools"><button class="btn" data-task-reset>↻ Reset Checkboxes for a New Day</button><small data-task-save>${taskStorageAvailable?'Saved separately on this browser':'Browser storage unavailable'}</small></div><div class="tracker-status" role="status" aria-live="polite"></div>`}</div>`;}
function syncTaskIndicators(){const t=taskStats();document.querySelectorAll('[data-task-badge]').forEach(el=>{el.textContent='🔔 '+t.pending;el.classList.toggle('pending',t.pending>0);el.setAttribute('aria-label',t.pending+' unfinished tasks');});document.querySelectorAll('[data-task-fraction]').forEach(el=>el.textContent=`${t.done} of ${t.total} habits complete`);document.querySelectorAll('[data-task-percent]').forEach(el=>el.textContent=t.percent+'%');document.querySelectorAll('.tracker-progress').forEach(el=>{el.setAttribute('aria-valuenow',t.percent);el.firstElementChild.style.width=t.percent+'%';});document.querySelectorAll('[data-task-id]').forEach(el=>{const task=nightlyTasks.find(t=>t.id===el.dataset.taskId);if(task){el.checked=task.done;el.closest('.task-row').classList.toggle('done',task.done);}});document.querySelectorAll('[data-task-save]').forEach(el=>el.textContent=taskStorageAvailable?'Saved separately on this browser':'Browser storage unavailable');}
function openNightlyTracker(){simpleModal("📋 User's Plan Before Night Action Plan like ToDo list & Progress Tracker",trackerMarkup());}
function upgradeCopy(){const sampleButton=document.querySelector('[data-action="sample"]');if(sampleButton){sampleButton.textContent='⚡ 1-Click Instant Demo Business (Try Now!)';sampleButton.classList.add('demo-cta');}const launch=document.querySelector('#setupForm button[type="submit"]');if(launch)launch.textContent='🚀 Launch My Business & Start Making Money';const run=$('startButton');if(run)run.textContent="🔥 Run Today's Operations & See Live Sales!";const hero=document.querySelector('#setupForm')?document.querySelector('.page-head h1'):null;if(hero){hero.textContent='Test Your Business Idea With ৳1,00,000 Virtual Capital Before Risking Real Money!';hero.classList.add('hero-hook');hero.parentElement.querySelector('.subtitle').textContent='Practice bold decisions. Watch live sales. Build your founder instincts with virtual money.';}document.querySelectorAll('.panel-head h2').forEach(el=>{if(el.textContent==='Make it your business')el.textContent='Build Your Business. Own Your Next Move.';if(el.textContent.startsWith('Let’s plan day'))el.textContent=`Win Day ${state.day}: Make Your Moves`;});document.querySelectorAll('[data-action="nextDay"]').forEach(el=>el.textContent=`🚀 Build My Day ${state.day+1} Game Plan`);}
const baseRender=render;
render=function(){baseRender();if(state&&currentView==='dashboard'){const roadmapSection=document.querySelector('.roadmap-strip');if(roadmapSection)roadmapSection.insertAdjacentHTML('beforebegin',`<section class="panel tracker-card"><div class="panel-head"><h2 class="tracker-heading">📋 User's Plan Before Night Action Plan like ToDo list & Progress Tracker</h2>${taskBadge()}</div><div class="panel-body">${trackerMarkup(true)}</div></section>`);}upgradeCopy();syncTaskIndicators();};
const baseShowModal=showModal;
showModal=function(html,small=false){baseShowModal(html,small);$('modalRoot').querySelector('.modal').insertAdjacentHTML('beforeend',signature());upgradeCopy();};
document.querySelector('.top-actions').insertAdjacentHTML('beforeend',`<button class="btn tracker-trigger" data-nightly-open title="User's Plan Before Night Action Plan like ToDo list & Progress Tracker">📋 Nightly Action Plan ${taskBadge()}</button>`);
document.addEventListener('change',e=>{const id=e.target.dataset.taskId;if(!id)return;const task=nightlyTasks.find(t=>t.id===id);if(!task)return;task.done=e.target.checked;saveTasks();const status=document.querySelector('.tracker-status');if(status)status.textContent=task.done?'✓ One action closer to a stronger tomorrow.':'Task reopened. Keep moving at your pace.';});
document.addEventListener('submit',e=>{if(!e.target.matches('.task-add'))return;e.preventDefault();const input=e.target.querySelector('input'),text=input.value.trim();if(!text){input.setCustomValidity('Enter a task before adding it.');input.reportValidity();return;}if(nightlyTasks.length>=100){toast('Your plan has 100 tasks. Complete or remove a custom task first.');return;}nightlyTasks.push({id:'custom-'+Date.now()+'-'+Math.random().toString(36).slice(2,9),text,done:false,custom:true});saveTasks();e.target.closest('.tracker-widget').querySelector('.task-list').innerHTML=taskRows();input.value='';input.focus();const status=document.querySelector('.tracker-status');if(status)status.textContent='Task added. Your plan is saved.';});
document.addEventListener('input',e=>{if(e.target.id==='nightlyTaskInput')e.target.setCustomValidity('');});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.hasAttribute('data-nightly-open'))openNightlyTracker();if(b.hasAttribute('data-task-reset')){nightlyTasks.forEach(t=>t.done=false);saveTasks();document.querySelector('.tracker-status').textContent='Fresh day, fresh focus. All tasks retained and unchecked.';}if(b.dataset.removeTask){nightlyTasks=nightlyTasks.filter(t=>t.id!==b.dataset.removeTask);saveTasks();const list=document.querySelector('.task-list');if(list)list.innerHTML=taskRows();$('nightlyTaskInput')?.focus();}});
window.addEventListener('storage',e=>{if(e.key!==TASK_KEY)return;try{const tasks=JSON.parse(e.newValue);if(!Array.isArray(tasks)||tasks.length>100||!tasks.every(t=>t&&typeof t.id==='string'&&typeof t.text==='string'&&typeof t.done==='boolean'))return;nightlyTasks=tasks;syncTaskIndicators();document.querySelectorAll('.task-list').forEach(el=>el.innerHTML=taskRows());}catch(error){}});
// Visual counters are derived from active-day data; they never write to business state.
let storeVisual={orders:0,paid:0,lastSpawn:0};
function storefrontMarkup(){return `<section class="live-storefront" aria-label="Live storefront and order feed"><div class="store-title"><h3>🏪 Live Storefront · Watch Your Business Move!</h3><span class="tag">VIRTUAL SALES</span></div><div class="store-counts"><span>🛍️ Orders <b id="storeOrders">0</b></span><span>💸 Paid deliveries <b id="storePaid">0</b></span><span>📦 RTO <b id="storeReturns">0</b></span></div><div class="store-lane" id="storeLane" aria-hidden="true"><div class="store-zones"><span>🙋 Customers</span><span>📦 Packaging</span><span>🚚 Courier</span></div></div><p class="store-note">Tokens group larger order volumes. Payments reflect delivered product sales after event discounts; courier fees are separate. Simulation cash settles in the daily report.</p></section>`;}
function spawnStoreToken(kind,text){const lane=$('storeLane');if(!lane)return;while(lane.querySelectorAll('.visual-token').length>=12)lane.querySelector('.visual-token').remove();const token=document.createElement('span');token.className='visual-token '+kind;token.textContent=text;token.style.setProperty('--travel',Math.round(lane.clientWidth*(kind==='customer-token'?.44:.4))+'px');lane.appendChild(token);setTimeout(()=>token.remove(),1800);}
function updateStorefront(){const a=state?.active;if(!a||!$('storeLane'))return;const p=a.progress,ordered=Math.min(a.orders,Math.floor(a.orders*Engine.clamp(p/.9,0,1)));const riderPending=a.events.some(e=>e.type==='rider'&&!e.resolved);const delivered=a.orders-a.returns;const paid=riderPending?0:Math.min(delivered,Math.floor(delivered*Engine.clamp((p-.3)/.66,0,1)));$('storeOrders').textContent=num(ordered)+' / '+num(a.orders);$('storePaid').textContent=num(paid)+' / '+num(delivered);$('storeReturns').textContent=num(a.returns);const now=performance.now();if(now-storeVisual.lastSpawn<150)return;const newOrders=ordered-storeVisual.orders,newPaid=paid-storeVisual.paid;if(newOrders>0){spawnStoreToken('customer-token',(ordered%2?'🙋':'🧑‍💼')+(newOrders>1?' ×'+newOrders:''));spawnStoreToken('parcel-token','📦'+(newOrders>1?' ×'+newOrders:''));storeVisual.orders=ordered;}if(newPaid>0){const revenue=delivered*a.price-a.discount;const payment=Math.round(revenue*paid/Math.max(1,delivered))-Math.round(revenue*storeVisual.paid/Math.max(1,delivered));spawnStoreToken('payment-token','+'+money(payment)+(newPaid>1?' · '+newPaid+' orders':''));storeVisual.paid=paid;}if(newOrders>0||newPaid>0)storeVisual.lastSpawn=now;}
const baseOperations=showOperations;
showOperations=function(){storeVisual={orders:0,paid:0,lastSpawn:0};baseOperations();if(state?.active&&$('eventBox')){$('eventBox').insertAdjacentHTML('beforebegin',storefrontMarkup());const a=state.active;storeVisual.orders=Math.floor(a.orders*Engine.clamp(a.progress/.9,0,1));const pending=a.events.some(e=>e.type==='rider'&&!e.resolved);storeVisual.paid=pending?0:Math.floor((a.orders-a.returns)*Engine.clamp((a.progress-.3)/.66,0,1));updateStorefront();}};
const baseTick=tickOperations;
tickOperations=function(){baseTick();if(!document.hidden)updateStorefront();};
function celebrationMarkup(r){const threshold=Math.max(1000,state.config.capital*.005),tone=r.profit<0?'loss':r.profit>=threshold?'good':'steady';const title=tone==='good'?'🎉 Booming Business! You crushed it today!':tone==='loss'?'📉 Cash Burn Alert!':'⚖️ Holding Steady!';const message=tone==='good'?'Your decisions delivered. Review what worked and build on your momentum.':tone==='loss'?'Review your RTO returns, ad spend, or unit costs!':'Steady Grind 💪 Optimize margins or ad spend to scale up.';return `<section class="celebration ${tone}" role="status"><h3><span class="celebrate-icon">${tone==='good'?'🏆 🚀':tone==='loss'?'🔎':'💪'}</span> ${title}</h3><p><b>Net ${r.profit<0?'loss':'profit'}: ${money(r.profit)}</b> · ${message}</p><p style="font-size:10px">${r.delivered} paid deliveries · ${money(r.revenue)} product revenue after discounts</p>${tone==='good'?Array.from({length:24},(_,i)=>`<i class="confetti-bit" aria-hidden="true" style="left:${(i*37)%100}%;background:${['#22865b','#e6b83e','#65a9d7','#d87591'][i%4]};animation-delay:${i%6*.06}s"></i>`).join(''):''}</section>`;}
const baseReport=showReport;
showReport=function(r,latest=false){baseReport(r,latest);$('modalRoot').querySelector('.modal-content').insertAdjacentHTML('afterbegin',celebrationMarkup(r));};
// Clarify the separate checklist retention policy without altering Reset Game.
const basePrivacy=actions.privacy;
actions.privacy=function(){basePrivacy();const list=$('modalRoot').querySelector('.privacy-list');if(list)list.insertAdjacentHTML('beforeend','<li>The nightly checklist uses a separate localStorage key. Reset Game preserves your habits and custom tasks. Reset Checkboxes starts a fresh checklist day; custom tasks can be removed individually.</li>');};
render();
</script>
